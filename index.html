<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Glowing Heart</title>
<style>
  * { box-sizing: border-box; }
  html, body { 
    margin: 0; 
    padding: 0; 
    width: 100%; 
    height: 100%; 
    background: #000; 
    overflow: hidden; 
  }
  canvas { 
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block; 
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, u;

function resize() {
  W = cv.width = window.innerWidth;
  H = cv.height = window.innerHeight;
  u = Math.min(W, H) * 0.035; 
}
resize();
window.addEventListener('resize', resize);

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const r = mulberry(42);
const SPARK = ['#ffffff', '#dfe8ff', '#ffe9f7', '#e6fff7', '#cfd8ff'];
const sm = (a, b, x) => { x = Math.max(0, Math.min(1, (x - a) / (b - a))); return x * x * (3 - 2 * x); };

const HEART_N = 1400, GATHER_FRAMES = 120;
const P = [];

// ایجاد ذرات با مختصات نسبی فرمول قلب
for (let i = 0; i < HEART_N; i++) {
  const t = r() * 6.2832, k = r() < 0.55 ? 1 : Math.sqrt(r());
  const hx = 16 * Math.pow(Math.sin(t), 3);
  const hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
  P.push({
    sx: r(), // ذخیره به صورت درصدی (0 تا 1) برای جلوگیری از باگ تغییر سایز
    sy: r(), 
    hx: hx * k, 
    hy: hy * k,
    r: 0.8 + Math.pow(r(), 2.5) * 3.2, 
    sp: 0.05 + r() * 0.13, 
    ph: r() * 6.28, 
    dl: r() * 40,
    sw: (r() - 0.5) * 2, 
    c: SPARK[Math.floor(r() * SPARK.length)]
  });
}

let frame = 0;
function animate() {
  frame++;
  const fade = sm(0, 40, frame);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; 
  ctx.fillRect(0, 0, W, H);

  const settled = sm(0, GATHER_FRAMES + 70, frame);
  const beat = 1 + 0.035 * Math.sin(Math.max(0, frame - GATHER_FRAMES - 70) * 0.11) * settled;
  
  ctx.globalCompositeOperation = 'lighter';
  const gr = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, u * 22 * beat);
  gr.addColorStop(0, 'rgba(200,215,255,0.20)'); 
  gr.addColorStop(1, 'rgba(200,215,255,0)');
  ctx.globalAlpha = settled; 
  ctx.fillStyle = gr; 
  ctx.fillRect(0, 0, W, H);

  for (const p of P) {
    const e = sm(0, GATHER_FRAMES, frame - p.dl), off = Math.sin(Math.PI * e) * p.sw * 140;
    
    // تبدیل مختصات درصدی به مختصات فعلی صفحه
    const startX = p.sx * W;
    const startY = p.sy * H;

    // نقطه دقیق هدف در مرکز صفحه
    const targetX = W / 2 + p.hx * u;
    const targetY = H / 2 - (p.hy + 2.5) * u;

    let x = startX + (targetX - startX) * e + off + Math.sin(frame * 0.02 + p.ph) * 8 * (1 - e);
    let y = startY + (targetY - startY) * e + off * 0.5 + Math.cos(frame * 0.02 + p.ph) * 8 * (1 - e);
    
    x = W / 2 + (x - W / 2) * beat; 
    y = H / 2 + (y - H / 2) * beat;
    
    const tw = Math.sin(frame * p.sp + p.ph), a = 0.3 + 0.7 * Math.max(0, tw), z = p.r * (0.6 + 0.6 * Math.max(0, tw));
    ctx.globalAlpha = fade * a; 
    ctx.fillStyle = p.c;
    ctx.fillRect(x - z / 2, y - z / 2, z, z);
    
    if (p.r > 2 && tw > 0.5) { 
      ctx.fillRect(x - z * 2, y - 0.4, z * 4, 0.8); 
      ctx.fillRect(x - 0.4, y - z * 2, 0.8, z * 4); 
    }
  }
  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
